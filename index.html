      if (s.textContent.replace(/\s+/g, '') === label && s.querySelector('svg')) return s;
    }
    return null;
  }
  function currentKey() {
    var h = (location.hash || '').replace(/^#\/?/, '').split(/[?\/]/)[0];
    if (!h) return 'Home';
    for (var k in NAV) if (k !== 'Home' && NAV[k] === h) return k;
    return '';
  }
  function findFooter() {
    var cands = document.querySelectorAll('#root div.fixed');
    for (var i = 0; i < cands.length; i++) {
      var t = cands[i].textContent;
      if (/Bookmarks/.test(t) || /Disable Ads/.test(t) || /Support us/.test(t)) return cands[i];
    }
    return null;
  }
  var dock = null;
  function syncDock() {
    var key = currentKey();
    document.body.setAttribute('data-int-route', key);
    if (!dock) return;
    var bs = dock.querySelectorAll('button[data-k]');
    for (var i = 0; i < bs.length; i++) {
      var on = bs[i].getAttribute('data-k') === key;
      if (on) bs[i].classList.add('on'); else bs[i].classList.remove('on');
      if (on) bs[i].setAttribute('aria-current', 'page'); else bs[i].removeAttribute('aria-current');
    }
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function mkSvg(paths) {
    var sv = document.createElementNS(SVGNS, 'svg');
    sv.setAttribute('viewBox', '0 0 24 24'); sv.setAttribute('fill', 'none'); sv.setAttribute('stroke', 'currentColor');
    sv.setAttribute('stroke-width', '2'); sv.setAttribute('stroke-linecap', 'round'); sv.setAttribute('stroke-linejoin', 'round');
    paths.forEach(function (d) { var p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d); sv.appendChild(p); });
    return sv;
  }
  function homeIcon() { return mkSvg(['M3 11.5 12 4l9 7.5', 'M5.5 10v9.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V10']); }
  function buildDock() {
    if (dock && dock.isConnected) return;
    var spans = {};
    for (var k in NAVREAL) { spans[k] = navSpan(k); if (!spans[k]) return; }
    dock = document.createElement('div');
    dock.id = 'int-dock';
    dock.setAttribute('role', 'navigation');
    Object.keys(NAV).forEach(function (label) {
      var b = document.createElement('button');
      b.setAttribute('type', 'button');
      b.setAttribute('data-k', label);
      var svg = label === 'Home' ? homeIcon() : spans[label].querySelector('svg').cloneNode(true);
      if (svg) b.appendChild(svg);
      var t = document.createElement('span');
      t.textContent = label;
      b.appendChild(t);
      b.addEventListener('click', function () {
        if (label === 'Home') { location.hash = '#/'; }
        else { var el = navSpan(label); if (el) el.click(); }
        setTimeout(syncDock, 50);
      });
      dock.appendChild(b);
    });
    document.body.appendChild(dock);
    syncDock();
  }
  function placeDock() {
    if (!dock || !dock.isConnected) return;
    var home = currentKey() === 'Home';
    var w = document.querySelector('.int-search-wrap');
    if (home && w && w.parentElement) {
      var host = w.parentElement;
      if (dock.parentNode !== host || dock.previousElementSibling !== w) host.insertBefore(dock, w.nextSibling);
      dock.classList.remove('mini');
    } else if (!home) {
      if (dock.parentNode !== document.body) document.body.appendChild(dock);
      dock.classList.add('mini');
    }
  }
  function hideShortcuts() {
    var rows = document.querySelectorAll('#root div.flex-wrap');
    for (var i = 0; i < rows.length; i++) {
      if ((rows[i].getAttribute('class')||'').indexOf('max-w-160') > -1 && rows[i].querySelector('svg.lucide-plus') || rows[i].querySelector('svg.lucide-globe')) rows[i].setAttribute('data-int', 'hide');
    }
  }
  function tidy() {
    // hide the old top-right nav group and the old footer (Support us, Disable Ads, Discord, Bookmarks)
    var a = navSpan('Apps');
    if (a && a.parentElement && a.parentElement.getAttribute('data-int') !== 'hide') {
      var grp = a.parentElement;
      buildDock();
      grp.setAttribute('data-int', 'hide');
      var hdr = grp.parentElement;
      if (hdr && hdr.id !== 'root' && hdr.tagName !== 'BODY') hdr.setAttribute('data-int', 'hide');
    }
    var f = findFooter();
    if (f) { if (f.getAttribute('data-int') !== 'hide') f.setAttribute('data-int', 'hide'); }
    // search bar ring
    var inp = document.querySelector('#root input');
    if (inp) {
      var box = inp.closest ? inp.closest('[class*="40.625rem"]') : null;
      if (box && !box.classList.contains('int-search') && box.parentElement) {
        box.classList.add('int-search');
        var r = getComputedStyle(box).borderTopLeftRadius;
        box.parentElement.classList.add('int-search-wrap');
        box.parentElement.style.setProperty('--int-r', r && r !== '0px' ? r : '16px');
        var padBox = box.closest('[class*="px-20"]'); if (padBox) padBox.setAttribute('data-int', 'pad');
        var cs = getComputedStyle(box.parentElement);
        if (cs.position === 'static') box.parentElement.style.position = 'relative';
      }
    }
    hideShortcuts();
    placeDock();
    syncDock();
  }

  var queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    (window.requestAnimationFrame || setTimeout)(function () { queued = false; try { tidy(); } catch (e) {} });
  }

  fixAllSheets();
  fixTree(document.body);
  var mo = new MutationObserver(function (muts) {
    for (var i = 0; i < muts.length; i++) {
      var m = muts[i];
      if (m.type === 'attributes') { fixInline(m.target); continue; }
      for (var j = 0; j < m.addedNodes.length; j++) fixTree(m.addedNodes[j]);
    }
    schedule();
  });
  mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
  window.addEventListener('hashchange', function () { blockRoutes(); placeDock(); syncDock(); schedule(); });
  blockRoutes();
  window.addEventListener('popstate', syncDock);
  schedule();
  try { redWhite(); } catch (e) {}
}

function redWhite() {
  /* Fixed white-and-red look, no toggle.
     The page is drawn dark, then two full-screen blend layers convert it:
     1) difference with white inverts it (black -> white, white -> black)
     2) lighten with red turns every dark pixel red and leaves white as white */
  var css = document.createElement('style');
  css.id = 'int-theme-style';
  css.textContent = [
    '#int-invert,#int-red{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none}',
    '#int-invert{background:#fff;mix-blend-mode:difference;z-index:2147483000}',
    '#int-red{background:#e4002b;mix-blend-mode:lighten;z-index:2147483001}'
  ].join('');
  (document.head || document.body).appendChild(css);
  var inv = document.createElement('div'); inv.id = 'int-invert';
  var red = document.createElement('div'); red.id = 'int-red';
  document.body.appendChild(inv); document.body.appendChild(red);
  // keep the layers alive if the app ever clears the body
  setInterval(function () {
    if (!inv.isConnected) document.body.appendChild(inv);
    if (!red.isConnected) document.body.appendChild(red);
  }, 1500);
}

popupGuard();
skyAndLogo();
interestingUI();
